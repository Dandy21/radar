<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>רדאר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Frank+Ruhl+Libre:wght@400;500;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap">
<style>
/* Layout: lean-back TV screen. Fixed top bar with Israel/World tabs, a "billboard" that previews the focused story (title + summary), and Netflix-style horizontal rows below. D-pad: up/down = rows, left/right = stories, OK = read. Reader is a full-screen overlay. Single dark look on purpose (TV). */
:root{
  color-scheme:dark;
  --bg:#0A0F17; --bg-2:#0F1622; --surface:#161F2E; --surface-hi:#1F2A3D; --line:#27334A;
  --ink:#F0F3F8; --muted:#9AA6B8; --dim:#6E7A8E;
  --signal:#55CDB1; --on-signal:#06201A; --focus:#F0F3F8;
  --t-ai:#A996F5; --t-vc:#EBAE58; --t-general:#74ABF0; --t-il:#62C0E3; --t-world:#C9A7E8;
  --f-display:"Secular One","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --f-read:"Frank Ruhl Libre","Times New Roman",serif;
  --f-ui:"IBM Plex Sans Hebrew",system-ui,-apple-system,sans-serif;
}
html{font-size:clamp(15px,1.45vw,30px);height:100%}
html,body{background:var(--bg);color:var(--ink)}
body{height:100%;font:1rem/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus{outline:none}
[dir=ltr]{unicode-bidi:isolate}

#app{direction:rtl;height:100%;display:grid;grid-template-rows:auto auto 1fr auto;min-height:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.pad{padding-left:max(2.6rem,env(safe-area-inset-left,0px));padding-right:max(2.6rem,env(safe-area-inset-right,0px))}}

/* top bar */
.top{display:flex;align-items:center;gap:1.4rem;padding-block:1rem .6rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem}
.brand svg{width:2.2rem;height:2.2rem}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1}
.tabs{display:flex;gap:.4rem;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:.25rem}
.tab{padding:.35rem 1.15rem;border-radius:999px;font-weight:500;font-size:1rem;color:var(--muted);transition:background .15s,color .15s,transform .15s}
.tab[aria-selected="true"]{background:var(--surface-hi);color:var(--ink)}
.tab:focus-visible,.tab.kf{background:var(--ink);color:var(--bg);transform:scale(1.06)}
.updated{margin-inline-start:auto;font-size:.8rem;color:var(--dim)}
.fs{border:1px solid var(--line);background:var(--bg-2)}

/* billboard */
.bill{position:relative;padding-block:1rem 1.2rem;min-height:14.5rem;display:grid;align-content:end;gap:.6rem;
  background:var(--bg);
  background:radial-gradient(60rem 22rem at 85% 0%, color-mix(in srgb,var(--c,var(--t-general)) 16%, transparent), transparent 70%), var(--bg);
  transition:background .3s}
.kick{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .7rem;font-size:.85rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:.4rem;font-weight:600;color:var(--c,var(--muted));letter-spacing:.02em}
.pill i{width:.55rem;height:.55rem;border-radius:50%;background:currentColor}
.reg{border:1px solid var(--line);border-radius:999px;padding:.05rem .6rem;font-size:.78rem;color:var(--ink)}
.bill h2{font-family:var(--f-read);font-weight:700;font-size:2.15rem;line-height:1.18;max-width:46rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bill .dek{font-family:var(--f-read);font-size:1.18rem;line-height:1.55;color:#C9D1DD;color:color-mix(in srgb,var(--ink) 82%,var(--bg));max-width:52rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.done{display:inline-flex;align-items:center;gap:.35rem;color:var(--signal);font-weight:600}
.hintok{font-size:.78rem;color:var(--dim)}

/* rows */
.rows{overflow-y:auto;overflow-x:hidden;position:relative;padding-block:.4rem 3rem;scroll-behavior:smooth;min-height:0}
.row{display:grid;gap:.55rem;padding-block:.55rem .9rem}
.rowhead{display:flex;align-items:baseline;gap:.7rem}
.rowhead h3{font-family:var(--f-ui);font-weight:600;font-size:1.15rem}
.rowhead .ctx{font-size:.72rem;letter-spacing:.08em;font-weight:600;color:var(--signal);border:1px solid color-mix(in srgb,var(--signal) 45%,transparent);border-radius:.3rem;padding:0 .4rem}
.rowhead small{font-size:.8rem;color:var(--dim)}
.track{display:flex;gap:1rem;overflow-x:auto;scrollbar-width:none;padding-block:.5rem .6rem;padding-inline:.4rem;margin-inline:-.4rem;scroll-padding-inline:3rem;scroll-behavior:smooth}
.track::-webkit-scrollbar{display:none}

.card{flex:none;width:17.5rem;min-height:9.6rem;background:var(--surface);border:1px solid var(--line);border-radius:.7rem;padding:.85rem 1rem .8rem;
  display:grid;grid-template-rows:auto 1fr auto;gap:.45rem;text-align:start;position:relative;transition:transform .16s ease,background .16s,border-color .16s,box-shadow .16s}
.card .pill{font-size:.75rem}
.card h4{margin:0;font-family:var(--f-read);font-weight:700;font-size:1.08rem;line-height:1.32;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:.74rem;color:var(--dim);display:flex;gap:.4rem;flex-wrap:wrap}
.card.read h4{color:var(--muted);font-weight:500}
.check{position:absolute;inset-block-start:.6rem;inset-inline-end:.6rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--signal);color:var(--on-signal);display:grid;place-items:center}
.check svg{width:.95rem;height:.95rem}
.card:focus-visible,.card.kf{transform:scale(1.06);background:var(--surface-hi);border-color:var(--focus);box-shadow:0 0 0 .18rem var(--focus),0 1rem 2.2rem rgba(0,0,0,.5);z-index:1}
.card:hover{border-color:var(--muted)}

.empty{padding-block:2rem;color:var(--muted);font-size:1.1rem;display:grid;gap:.4rem}
.empty b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;color:var(--ink)}
.keys{padding-block:.45rem .7rem;font-size:.75rem;color:var(--dim);display:flex;gap:1.4rem;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--bg)}
.keys kbd{font-family:var(--f-ui);border:1px solid var(--line);border-radius:.3rem;padding:0 .35rem;margin-inline-end:.3rem;color:var(--muted)}

/* reader */
.reader{position:fixed;inset:0;z-index:20;background:var(--bg);direction:rtl;display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rbar{display:flex;gap:.7rem;align-items:center;padding-block:.8rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rbar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--line);background:var(--surface);border-radius:.55rem;padding:.4rem 1rem;font-weight:500;font-size:.95rem;text-decoration:none;transition:transform .15s,background .15s}
.btn[aria-pressed="true"]{color:var(--signal);border-color:color-mix(in srgb,var(--signal) 50%,transparent)}
.btn:focus-visible,.btn.kf{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:scale(1.05)}
.scroller{overflow-y:auto;min-height:0;scroll-behavior:smooth}
.progress{height:.2rem;background:var(--signal);width:0;transition:width .2s}
.article{max-width:50rem;margin-inline:auto;padding-block:2rem 5rem;display:grid;gap:1.4rem}
.article h1{font-family:var(--f-read);font-weight:700;font-size:2.5rem;line-height:1.15}
.byline{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.9rem;color:var(--muted)}
.summary{background:var(--bg-2);border:1px solid var(--line);border-radius:.8rem;padding:1.1rem 1.4rem;display:grid;gap:.5rem}
.label{font-size:.75rem;letter-spacing:.1em;font-weight:600;color:var(--signal)}
.summary p{font-family:var(--f-read);font-size:1.4rem;line-height:1.6}
.divider{display:flex;align-items:center;gap:.8rem;color:var(--dim);font-size:.8rem;letter-spacing:.08em}
.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.body{display:grid;gap:1.2rem;font-family:var(--f-read);font-size:1.32rem;line-height:1.8;color:#E2E7EF;color:color-mix(in srgb,var(--ink) 92%,var(--bg))}
.ask{display:grid;gap:.7rem;border-top:1px solid var(--line);padding-top:1.2rem}
.ask .qs{display:flex;flex-wrap:wrap;gap:.6rem}
.answer{font-family:var(--f-read);font-size:1.15rem;line-height:1.7;white-space:pre-wrap;background:var(--bg-2);border-radius:.6rem;padding:1rem 1.2rem}
.answer:empty{display:none}
.src{display:grid;gap:.4rem;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1rem}
.next{display:grid;gap:.3rem;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:.8rem;padding:1rem 1.2rem;transition:transform .15s}
.next span{font-size:.75rem;letter-spacing:.08em;color:var(--signal);font-weight:600}
.next b{font-family:var(--f-read);font-size:1.25rem;line-height:1.3}
.next:focus-visible,.next.kf{border-color:var(--focus);box-shadow:0 0 0 .18rem var(--focus);transform:scale(1.02)}

.toast{position:fixed;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:.6rem;font-size:.9rem;z-index:40;direction:rtl}

@media (max-width:640px){
  .bill{min-height:0}
  .bill h2{font-size:1.6rem}
  .card{width:15rem}
  .keys{display:none}
  .article h1{font-size:1.8rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* lock screen */
.lock{min-height:100%;display:grid;place-items:center;direction:rtl;padding-block:2rem}
.lockbox{display:grid;gap:1rem;max-width:34rem;width:100%;text-align:start}
.lockbox .brand b{font-size:2.2rem}
.lockbox p{color:var(--muted);font-size:1rem}
.lockbox form{display:flex;gap:.7rem;flex-wrap:wrap}
.lockbox input{flex:1;min-width:12rem;font:1.2rem/1.4 var(--f-ui);letter-spacing:.06em;direction:ltr;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:.55rem;padding:.55rem .8rem}
.lockbox input:focus{border-color:var(--focus);box-shadow:0 0 0 .15rem var(--focus)}
.lockbox .err{color:#F2A08A}
.lockbox .err:empty{display:none}
</style>
<style>
/* old TV browser fallbacks */
.reader{top:0;right:0;bottom:0;left:0}
.check{top:.6rem;left:.6rem}
.card:focus,.tab:focus,.btn:focus,.next:focus{outline:none}
.card:focus{transform:scale(1.06);background:var(--surface-hi);border-color:var(--focus);box-shadow:0 0 0 .18rem var(--focus),0 1rem 2.2rem rgba(0,0,0,.5);z-index:1}
.tab:focus{background:var(--ink);color:var(--bg)}
.btn:focus{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.next:focus{border-color:var(--focus);box-shadow:0 0 0 .18rem var(--focus)}
.tabs>*+*{margin-right:.4rem}
.track>*+*{margin-right:1rem}
@supports (gap:1rem){.tabs>*+*,.track>*+*{margin-right:0}}
</style>
<style>body{margin:0}</style>
</head>
